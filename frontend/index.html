<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>School Friend AI</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>🎓 School Friend AI</h1>
      <p>Your K-12 study buddy - ask me about math, science, English, history, geography, or computer science!</p>
    </header>

    <div id="chat" class="chat"></div>

    <form id="chat-form" class="input-row">
      <input id="message-input" type="text" placeholder="Ask a school question..." autocomplete="off" required />
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="/app.js"></script>
</body>
</html>
